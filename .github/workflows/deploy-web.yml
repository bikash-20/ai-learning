name: deploy-web
on:
  push: { branches: [main], paths: ['apps/web/**', 'packages/**', '.github/workflows/deploy-web.yml'] }
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Pull Vercel project info
        run: echo '{"projectId":"prj_vt7GBDDjVk0oiEN6Cra6VJn4Gnkw","orgId":"team_Hn2n2SLNIQKACaKcA1LsB2Ky","projectName":"web","settings":{"rootDirectory":"apps/web","framework":"nextjs"}}' > apps/web/.vercel/project.json
      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/web
          production: true